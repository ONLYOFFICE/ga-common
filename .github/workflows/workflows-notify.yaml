name: Workflows notify

on:
  workflow_dispatch:
    inputs:
      publish_workflows:
        description: 'Publish the Workflows health digest'
        required: false
        type: boolean
        default: true
      publish_buildservers:
        description: 'Publish the Buildservers health digest'
        required: false
        type: boolean
        default: true
      publish_claude_review:
        description: 'Publish the Claude Review stats digest'
        required: false
        type: boolean
        default: true
      claude_review_period:
        description: 'Time window for the Claude Review stats digest'
        required: false
        type: choice
        options:
          - day
          - week
          - month
        default: week
  schedule:
    - cron: "30 6 * * *"

jobs:
  check-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Notify failed runs
        env:
          PUBLISH_WORKFLOWS: ${{ inputs.publish_workflows }}
          PUBLISH_BUILDSERVERS: ${{ inputs.publish_buildservers }}
          PUBLISH_CLAUDE_REVIEW: ${{ inputs.publish_claude_review }}
          CLAUDE_REVIEW_PERIOD: ${{ inputs.claude_review_period }}
          EVENT_NAME: ${{ github.event_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_HOST: ${{ secrets.GITEA_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ONLYOFFICE
          TEAMLAB_URL: ${{ secrets.TEAMLAB_URL }}
          BUILDSERVER_URL: ${{ secrets.BUILDSERVER_URL }}
          BUILDSERVER_AUTH: ${{ secrets.BUILDSERVER_AUTH }}
          WORKFLOWS: |
            DocSpace                  | release               | Release
            DocSpace-buildtools       | oci-release           | Upload on S3
                                      | offline-release       | Upload offline archive
                                      | build_packages        | Build packages
                                      | main-build            | Build docker
                                      | config-build          | Config Trigger
                                      | cron-build            | Cron Trigger
                                      | ci-oci-docker-install | OCI Docker
                                      | ci-oci-install        | OCI Packages
                                      | ci-oci-update         | OCI Packages Update
                                      | readme-update         | Update readme
            OneClickInstall-Workspace | s3-release            | Upload on S3
                                      | ci-docker-install     | OCI Docker
                                      | ci                    | OCI Packages
                                      | ci-update             | OCI Packages Update
                                      | readme-update         | Update readme
            OneClickInstall-Docs      | scripts-upload-s3     | Upload on S3
                                      | ci-docker-install     | OCI Docker
                                      | ci-docs-test          | OCI Packages
                                      | ci-update             | OCI Packages Update
                                      | readme-update         | Update readme
            Docker-DocumentServer     | 4testing-build        | Build docker
            Docker-Docs               | build.yaml            | Build docker
            ga-common                 | keeplive              | Actions Keepalive
          WORKFLOWS_GITEA: |
            ga-common                 | claude-review         | Claude Review
          BUILDSERVER_JOBS: |
            Docs                      | release               | TEAMLAB_URL               | /view/OO/job/oo/ | ^release/v[0-9]+\.[0-9]+\.[0-9]+$
            DocSpace                  | appserver rpm         | BUILDSERVER_URL           | /job/appserver.rpm/
                                      | appserver deb         | BUILDSERVER_URL           | /job/appserver.deb/
                                      | release deb           | BUILDSERVER_URL           | /job/release.deb/
                                      | release rpm           | BUILDSERVER_URL           | /job/release.rpm/
                                      | production deb        | BUILDSERVER_URL           | /job/production.deb.publish/
                                      | production rpm        | BUILDSERVER_URL           | /job/production.rpm.publish/
                                      | production exe        | BUILDSERVER_URL           | /job/production.docspace.exe.publish/
        run: |
          source .github/scripts/notify-workflows.sh

          PUBLISH_WORKFLOWS="${PUBLISH_WORKFLOWS:-true}"
          PUBLISH_BUILDSERVERS="${PUBLISH_BUILDSERVERS:-true}"
          PUBLISH_CLAUDE_REVIEW="${PUBLISH_CLAUDE_REVIEW:-true}"
          CLAUDE_REVIEW_PERIOD="${CLAUDE_REVIEW_PERIOD:-week}"

          # Workflows/Buildservers: daily, whenever enabled.
          FULL_MESSAGE=""
          [[ "$PUBLISH_WORKFLOWS" == "true" || "$PUBLISH_BUILDSERVERS" == "true" ]] && FULL_MESSAGE="$(build_workflows_report)"
          SEND_FAILED=0
          send_telegram "$FULL_MESSAGE" || SEND_FAILED=1

          # Claude Review: weekly, Fridays only — or any day via manual dispatch (testing).
          IS_FRIDAY=false; [[ "$(date -u +%u)" == "5" ]] && IS_FRIDAY=true
          if [[ "$PUBLISH_CLAUDE_REVIEW" == "true" ]] && { $IS_FRIDAY || [[ "$EVENT_NAME" == "workflow_dispatch" ]]; }; then
            REVIEW_MESSAGES=()
            render_claude_review REVIEW_MESSAGES
            send_telegram "${REVIEW_MESSAGES[@]}" || SEND_FAILED=1
          fi
          exit "$SEND_FAILED"
