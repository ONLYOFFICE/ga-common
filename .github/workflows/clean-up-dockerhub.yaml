name: Cleanup old Docker Hub tags

on:
  #schedule:
  #  - cron: '0 3 1 * *'        # 1st day of every month, 03:00 UTC
  #workflow_dispatch:
  #  inputs:
  #    dry_run:
    #      description: 'Only show what would be deleted (delete nothing)'
    #    type: boolean
    #    default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USER_PAT }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_PAT }}
      # Manual run -> use the input flag; scheduled run -> actually delete
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      MAX_AGE_DAYS: '365'
      REPOS: |
        onlyoffice/4testing-documentserver
        onlyoffice/4testing-documentserver-ee
        onlyoffice/4testing-documentserver-de
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete tags older than MAX_AGE_DAYS
        run: python3 -u .github/scripts/docker_tags_cleanup.py
