name: Test update year

on:
  push:
    branches:
      - feature/test-update-year
    paths:
      - '.gitea/workflows/update-year.yml'
      - '.gitea/scripts/update-year.py'

concurrency:
  group: Test-Update-Year
  cancel-in-progress: false

env:
  GITEA_HOST: ${{ secrets.CI_GITEA_HOST }}
  GIT_TERMINAL_PROMPT: '0'
  # Isolated publishing test; keep this configuration on feature/test-update-year.
  YEAR_CONFIG: |
    {
      "organization": "ONLYOFFICE",
      "holders": ["Ascensio System SIA"],
      "repositories": [
        {"name": "OneClickInstall-Docs", "include": ["LICENSE", "*.sh"]}
      ]
    }

jobs:
  update-year:
    if: github.event_name == 'push' && github.ref_name == 'feature/test-update-year'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ga-common
        env:
          REF_NAME: ${{ github.ref_name }}
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          : "${GITEA_HOST:?GITEA_HOST is required}"
          : "${GITEA_TOKEN:?GITEA_TOKEN is required}"
          git config --global credential.helper '!f(){ echo "username=oauth2"; echo "password=$GITEA_TOKEN"; }; f'
          git clone "https://$GITEA_HOST/ONLYOFFICE/ga-common" --depth=1 --branch "$REF_NAME" .

      - name: Update copyright years
        env:
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          exec python3 .gitea/scripts/update-year.py run --output update-year-output \
            --repositories OneClickInstall-Docs --year 2027 --publish

      - name: Upload patches and report
        if: always()
        # Match the artifact version used by the other Gitea workflows.
        uses: actions/upload-artifact@v3.2.2
        with:
          name: update-year
          path: update-year-output/
          retention-days: 30
          if-no-files-found: ignore
