name: Bugzilla Triage
run-name: "Triage • Bug ${{ inputs.bug_id }}"

on:
  workflow_dispatch:
    inputs:
      bug_id:
        description: 'Bugzilla bug id (e.g. 83616)'
        required: true
        type: string
      model:
        description: 'Claude model'
        required: false
        type: string
        default: claude-sonnet-5
      claude_code_version:
        # Pinned, not 'latest': the run depends on specific CLI flags (--effort, --max-budget-usd,
        # --json-schema), so bump it deliberately after a manual run with the new version.
        description: 'Claude Code CLI version (exact version, or a dist-tag like "latest" to test)'
        required: false
        type: string
        default: '2.1.250'
      effort:
        description: 'Reasoning effort level'
        required: false
        type: choice
        default: 'high'
        options:
          - low
          - medium
          - high
          - xhigh
          - max
      max_budget_usd:
        description: 'Hard cap on API spend for a single triage run (USD)'
        required: false
        type: string
        default: '2'

env:
  GITEA_HOST: ${{ secrets.CI_GITEA_HOST }}

concurrency:
  # Per bug, and queue rather than cancel: a duplicate webhook delivery for the same bug should
  # wait and then find the work already done, never race a live run (same reasoning as claude-review.yml).
  group: Bugzilla-Triage-${{ inputs.bug_id }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    # Generous next to the review job: several repositories get cloned before the model starts.
    timeout-minutes: 30
    env:
      BUG_ID: ${{ inputs.bug_id }}
    steps:
      - name: Validate input
        run: |
          set -euo pipefail
          [[ "$BUG_ID" =~ ^[0-9]{1,7}$ ]] || { echo "::error::bug_id must be a number, got '$BUG_ID'"; exit 1; }

      - name: Checkout ga-common
        env:
          REF_NAME: ${{ github.ref_name }}
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          git config --global credential.helper '!f(){ echo "username=oauth2"; echo "password=$GITEA_TOKEN"; }; f'
          git clone "https://$GITEA_HOST/ONLYOFFICE/ga-common" --depth=1 --branch "$REF_NAME" .

      - name: Select API key
        id: select_key
        env:
          ANTHROPIC_KEY_TRIAGE: ${{ secrets.ANTHROPIC_KEY_TRIAGE }}
          ANTHROPIC_KEY_DEFAULT: ${{ secrets.ANTHROPIC_KEY_DEFAULT }}
        run: |
          set -euo pipefail
          # A dedicated key keeps triage spend separate from the per-repo review keys; falls back to the shared default.
          ANTHROPIC_API_KEY="${ANTHROPIC_KEY_TRIAGE:-$ANTHROPIC_KEY_DEFAULT}"
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No Anthropic API key available (neither ANTHROPIC_KEY_TRIAGE nor ANTHROPIC_KEY_DEFAULT is set)"
            exit 1
          fi
          echo "::add-mask::$ANTHROPIC_API_KEY"
          echo "api_key=$ANTHROPIC_API_KEY" >> $GITHUB_OUTPUT

      - name: Prepare triage context
        id: prepare
        env:
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
          BUGZILLA_API_KEY: ${{ secrets.BUGZILLA_API_KEY }}
          BUGZILLA_HOST: ${{ secrets.BUGZILLA_HOST }}
          # Used only for the repository-selection call (see select-repos.py), never inside the sandbox.
          ANTHROPIC_API_KEY: ${{ steps.select_key.outputs.api_key }}
          SELECT_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ANTHROPIC_API_KEY"
          source .gitea/scripts/triage-steps.sh
          prepare_triage_context

      - name: Run triage (isolated container)
        # A bug the prepare step deliberately skipped (unrouted product, access-restricted) has no
        # prompt and no repositories, so every step from here on is simply not run - and
        # the job still ends green, because nothing failed.
        if: steps.prepare.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ steps.select_key.outputs.api_key }}
          CLAUDE_MODEL: ${{ inputs.model }}
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          CLAUDE_EFFORT: ${{ inputs.effort }}
          CLAUDE_MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
          # Well inside the job's own 30 minutes, so a hung session fails with a message and a
          # debug tail instead of being killed along with the whole step log.
          TRIAGE_CLI_TIMEOUT: '900'
        run: |
          set -euo pipefail
          echo "::add-mask::$ANTHROPIC_API_KEY"
          source .gitea/scripts/triage-sandbox.sh

          # DooD: the CLI runs in a throwaway nested container with only ANTHROPIC_API_KEY, egress
          # restricted to npm + Anthropic - no GITEA_TOKEN, no BUGZILLA_API_KEY, no docker.sock.
          name_triage_resources
          trap cleanup_triage_sandbox EXIT INT TERM
          cleanup_triage_sandbox

          resolve_triage_output_dir
          setup_triage_sandbox
          run_claude_triage
          summarize_claude_triage

      - name: Upload triage artifacts
        # v3: v4/v7 intermittently fail against a non-github.com host (GHESNotSupportedError).
        uses: actions/upload-artifact@v3.2.2
        if: always() && steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        with:
          name: claude-triage-artifacts
          path: |
            claude-output/claude-debug.log
            claude-output/claude-output.json
            claude-prompt.txt
            triage-message.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Report result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          # Read-only use: line-history.py asks this repository for the commits and the file
          # contents around the line the analysis named. Without it the script returns on its
          # first check and the "last touched" line silently never appears.
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          source .gitea/scripts/triage-steps.sh
          report_triage_result

      - name: Notify on failure
        # Self-contained on purpose: no source, no repository files. The earliest steps run
        # before anything is checked out, and a failure there is exactly the case this exists
        # for - sourcing a script that is not on disk yet would abort the alert precisely when
        # it matters most. Only the optional reason file comes from the workspace.
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_OPS: ${{ secrets.TELEGRAM_CHAT_ID_OPS }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          REASON=""
          case "${JOB_STATUS:-}" in
            # Concurrency cancels a superseded run as a matter of course, and the reason file below is
            # written by an always() step that still runs on cancellation - so this case has to come
            # first, or every cancelled run would alert.
            cancelled) exit 0 ;;
            failure)   REASON="run failed" ;;
            *)         [ -s pipeline-failure.txt ] && REASON=$(tr -d "\r" < pipeline-failure.txt | head -1) ;;
          esac
          [ -n "$REASON" ] || exit 0
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID_OPS:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID_OPS is unset - alert not sent"; exit 0
          fi
          # No literal host: it comes from the CI_GITEA_HOST secret, and ga-common is mirrored to public
          # GitHub. Without the secret the alert simply carries no link.
          LINK=""
          if [ -n "${GITEA_HOST:-}" ]; then
            LINK="https://$GITEA_HOST/${GITHUB_REPOSITORY:-ONLYOFFICE/ga-common}/actions/runs/$GITHUB_RUN_ID"
          fi
          TEXT=$(printf "%s problem\n%s - %s" "⚠️ Claude Triage" "Bug $BUG_ID" "$REASON")
          [ -n "$LINK" ] && TEXT=$(printf "%s\n%s" "$TEXT" "$LINK")
          curl -s --max-time 20 --retry 2 -o /dev/null -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "$TELEGRAM_CHAT_ID_OPS" --arg text "$TEXT" \
                  '{chat_id:$id,text:$text,disable_web_page_preview:true}')" || true
          echo "Failure alert sent"
