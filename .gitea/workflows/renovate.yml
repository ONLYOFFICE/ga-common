name: Renovate

on:
  schedule:
    # Mondays at 03:00 UTC: inside the "before 6am on monday" window the repositories' renovate.json files allow.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Comma-separated ORG/repo list; empty means the RENOVATE_REPOSITORIES variable'
        required: false
        type: string
      dry_run:
        description: 'Log what Renovate would do without creating branches or pull requests'
        required: false
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      renovate_version:
        description: 'Renovate image tag; empty means the version this workflow was last tested with'
        required: false
        type: string
      log_level:
        description: 'Renovate log level'
        required: false
        type: choice
        default: 'info'
        options:
          - 'info'
          - 'debug'

concurrency:
  group: Renovate
  cancel-in-progress: false

env:
  # Last tested image tag; bump it here after checking a manual dry run.
  DEFAULT_RENOVATE_VERSION: '44.221.4'
  # Repositories processed when neither the input nor the RENOVATE_REPOSITORIES variable names any.
  DEFAULT_REPOSITORIES: 'ONLYOFFICE/ga-common'

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Run Renovate
        env:
          GITEA_HOST: ${{ secrets.CI_GITEA_HOST }}
          # The token needs write access to every repository listed: it pushes the branches and opens the pull requests.
          RENOVATE_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
          # Renovate looks the action versions up on github.com even when the repository lives on Gitea (read-only public token).
          # Gitea refuses secret names that start with GITHUB_, so the secret is named differently and mapped below.
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          REPOSITORIES_VARIABLE: ${{ vars.RENOVATE_REPOSITORIES }}
          GIT_AUTHOR_VARIABLE: ${{ vars.RENOVATE_GIT_AUTHOR }}
          INPUT_REPOSITORIES: ${{ github.event.inputs.repositories }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_VERSION: ${{ github.event.inputs.renovate_version }}
          INPUT_LOG_LEVEL: ${{ github.event.inputs.log_level }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          : "${GITEA_HOST:?CI_GITEA_HOST is required}"
          : "${RENOVATE_TOKEN:?PAT_GITEA_TOKEN is required}"
          : "${GITHUB_COM_TOKEN:?RENOVATE_GITHUB_COM_TOKEN is required}"

          repositories="${INPUT_REPOSITORIES:-${REPOSITORIES_VARIABLE:-$DEFAULT_REPOSITORIES}}"
          repositories="${repositories//[[:space:]]/}"
          # Names only: the value is handed to Renovate as a list and must not carry anything else
          if ! [[ "$repositories" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+/[A-Za-z0-9._-]+)*$ ]]; then
            echo "::error::repositories must be a comma-separated list of ORG/repo names"; exit 1
          fi

          version="${INPUT_VERSION:-$DEFAULT_RENOVATE_VERSION}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::renovate_version must look like 44 or 44.221.4"; exit 1
          fi

          # A manual run is a dry run unless asked otherwise; the schedule always does the real work
          dry_run=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN:-true}" = "true" ]; then
            dry_run=true
          fi

          # The branch the pull requests go to: the newest release/* or hotfix/* line, else develop, else none (the default branch).
          # Same choice as the weekly review: the version must open the name and be dotted, a hotfix wins a tie with a release.
          target_branch() {
            local repository="$1" page=1 names="" batch branch branch_version rank
            while [ "$page" -le 100 ]; do
              batch=$(curl -sS --fail --max-time 30 -H "Authorization: token ${RENOVATE_TOKEN}" \
                "https://${GITEA_HOST}/api/v1/repos/${repository}/branches?limit=50&page=${page}" | jq -r '.[].name') || return 1
              [ -n "$batch" ] || break
              names+="${batch}"$'\n'
              page=$((page + 1))
            done
            branch=$(while IFS= read -r branch; do
                [[ "$branch" =~ ^(release|hotfix)/[A-Za-z0-9._/-]+$ ]] || continue
                [[ "${branch#*/}" =~ ^v?([0-9]+(\.[0-9]+)+) ]] || continue
                branch_version="${BASH_REMATCH[1]}"
                rank=0
                [ "${branch%%/*}" = "hotfix" ] && rank=1
                printf '%s\t%s\t%s\n' "$branch_version" "$rank" "$branch"
              done <<< "$names" | sort -t$'\t' -k1,1V -k2,2n | tail -n 1 | cut -f3)
            if [ -z "$branch" ] && grep -qx 'develop' <<< "$names"; then
              branch=develop
            fi
            echo "$branch"
          }

          options=(
            -e RENOVATE_PLATFORM=gitea
            -e "RENOVATE_ENDPOINT=https://${GITEA_HOST}/api/v1/"
            -e RENOVATE_TOKEN
            -e GITHUB_COM_TOKEN
            # Only repositories that carry their own renovate.json take part, and none is onboarded automatically
            -e RENOVATE_REQUIRE_CONFIG=required
            -e RENOVATE_ONBOARDING=false
            -e "LOG_LEVEL=${INPUT_LOG_LEVEL:-info}"
          )
          [ -z "${GIT_AUTHOR_VARIABLE:-}" ] || options+=(-e "RENOVATE_GIT_AUTHOR=${GIT_AUTHOR_VARIABLE}")
          [ "$dry_run" = "false" ] || options+=(-e RENOVATE_DRY_RUN=full)
          # A manual run works now, outside the schedule window of the repositories' renovate.json
          manual=false
          [ "$EVENT_NAME" != "workflow_dispatch" ] || manual=true

          echo "Renovate ${version}, repositories: ${repositories}, dry run: ${dry_run}"
          log=$(mktemp)
          failed=()
          IFS=',' read -ra repository_list <<< "$repositories"
          # One Renovate run per repository: RENOVATE_FORCE carries that repository's target branch
          for repository in "${repository_list[@]}"; do
            # Fail closed: a guess would send the pull requests to the default branch
            if ! target=$(target_branch "$repository"); then
              echo "::error::${repository}: cannot list the branches, skipped"; failed+=("$repository"); continue
            fi
            force=$(jq -cn --arg branch "$target" --argjson manual "$manual" \
              '(if $manual then {schedule: ["at any time"]} else {} end) + (if $branch != "" then {baseBranchPatterns: [$branch]} else {} end)')
            echo "::group::${repository} -> ${target:-default branch}"
            docker run --rm "${options[@]}" -e "RENOVATE_REPOSITORIES=${repository}" -e "RENOVATE_FORCE=${force}" \
              "renovate/renovate:${version}" 2>&1 | tee -a "$log" || failed+=("$repository")
            echo "::endgroup::"
          done

          # A listed repository without renovate.json on its default branch is only an INFO line and exit code 0
          disabled=$(sed -n 's/.*Repository is disabled.*(repository=\([^)]*\)).*/\1/p' "$log" | sort -u | paste -sd ',' -)
          if [ -n "$disabled" ]; then
            echo "::error::no renovate.json on the default branch, nothing was done for: ${disabled}"
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Renovate failed for: $(IFS=','; echo "${failed[*]}")"
          fi
          [ -z "$disabled" ] && [ "${#failed[@]}" -eq 0 ]

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITEA_HOST: ${{ secrets.CI_GITEA_HOST }}
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is unset - alert not sent"; exit 0
          fi
          # No literal host: it comes from the CI_GITEA_HOST secret, and ga-common is mirrored to public GitHub
          TEXT=$(printf "%s\n%s" "⚠️ Renovate run failed" "ga-common / Renovate")
          if [ -n "${GITEA_HOST:-}" ]; then
            TEXT=$(printf "%s\nhttps://%s/%s/actions/runs/%s" "$TEXT" "$GITEA_HOST" "${GITHUB_REPOSITORY:-ONLYOFFICE/ga-common}" "$GITHUB_RUN_ID")
          fi
          # TELEGRAM_CHAT_ID may hold several chat IDs separated by commas; blanks and repeats are skipped
          SENT_COUNT=0
          SEEN_IDS=","
          IFS=',' read -ra CHAT_IDS <<< "$TELEGRAM_CHAT_ID"
          for CHAT_ID in "${CHAT_IDS[@]}"; do
            CHAT_ID="${CHAT_ID//[[:space:]]/}"
            [ -n "$CHAT_ID" ] || continue
            case "$SEEN_IDS" in *",$CHAT_ID,"*) continue ;; esac
            SEEN_IDS+="$CHAT_ID,"
            if curl -sS --fail --max-time 20 --retry 2 -o /dev/null -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg id "$CHAT_ID" --arg text "$TEXT" \
                    '{chat_id:$id,text:$text,disable_web_page_preview:true}')"; then
              SENT_COUNT=$((SENT_COUNT + 1))
            else
              echo "::warning::Telegram alert was not delivered to chat $CHAT_ID"
            fi
          done
          if [ "$SENT_COUNT" -gt 0 ]; then echo "Failure alert sent"; else echo "::warning::Telegram alert was not delivered to any chat"; fi
