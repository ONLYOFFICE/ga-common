name: Claude Code Review
run-name: "Review • ${{ inputs.pr_url }}"

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'PR URL (e.g. https://HOST/ORG/REPO/pulls/123)'
        required: true
        type: string
      model:
        description: 'Claude model'
        required: false
        type: string
        default: claude-sonnet-5
      claude_code_version:
        description: 'Claude Code CLI version (npm dist-tag or exact version)'
        required: false
        type: string
        default: 'latest'
      effort:
        description: 'Reasoning effort level'
        required: false
        type: choice
        default: 'medium'
        options:
          - low
          - medium
          - high
          - xhigh
          - max
      force:
        description: 'Force review even if the head SHA was already reviewed'
        required: false
        type: boolean
        default: false
      max_budget_usd:
        description: 'Hard cap on API spend for a single review run (USD)'
        required: false
        type: string
        default: '5'

env:
  GITEA_HOST: ${{ secrets.CI_GITEA_HOST }}

concurrency:
  group: Claude-Review-${{ inputs.pr_url }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_URL: ${{ inputs.pr_url }}
      FORCE_REVIEW: ${{ inputs.force }}
    steps:
      - name: Resolve inputs
        env:
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$PR_URL" =~ ^https?://[^/]+/([^/]+)/([^/]+)/pulls/([0-9]+) ]]; then
            ORG_NAME="${BASH_REMATCH[1]}"
            REPO_NAME="${BASH_REMATCH[2]}"
            PR_NUMBER="${BASH_REMATCH[3]}"
          else
            echo "::error::Could not parse org/repo/PR number from pr_url: $PR_URL"
            exit 1
          fi
          PR_INFO=$(curl -sf -H "Authorization: token $GITEA_TOKEN" "https://$GITEA_HOST/api/v1/repos/$ORG_NAME/$REPO_NAME/pulls/$PR_NUMBER") \
            || { echo "::error::Could not fetch PR $ORG_NAME/$REPO_NAME!$PR_NUMBER from the Gitea API - check the URL and that the PR exists"; exit 1; }
          PR_BRANCH=$(jq -r '.head.ref' <<< "$PR_INFO")
          PR_SHA=$(jq -r '.head.sha' <<< "$PR_INFO")
          BASE_BRANCH=$(jq -r '.base.ref' <<< "$PR_INFO")
          if [ -z "$PR_BRANCH" ] || [ "$PR_BRANCH" = "null" ] || [ -z "$PR_SHA" ] || [ "$PR_SHA" = "null" ]; then
            echo "::error::PR $ORG_NAME/$REPO_NAME!$PR_NUMBER has no head branch/SHA (source branch likely deleted) - cannot check it out"
            exit 1
          fi
          { echo "ORG_NAME=$ORG_NAME"; echo "REPO_NAME=$REPO_NAME"; echo "PR_NUMBER=$PR_NUMBER"
            echo "PR_BRANCH=$PR_BRANCH"; echo "BASE_BRANCH=$BASE_BRANCH"; echo "PR_SHA=$PR_SHA"
          } >> "$GITHUB_ENV"
          echo "Resolved: $ORG_NAME/$REPO_NAME!$PR_NUMBER ($PR_BRANCH → $BASE_BRANCH @ ${PR_SHA:0:10})"

      - name: Select API key
        id: select_key
        env:
          ANTHROPIC_KEYS: ${{ secrets.ANTHROPIC_KEYS }}
          ANTHROPIC_KEY_DEFAULT: ${{ secrets.ANTHROPIC_KEY_DEFAULT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$ANTHROPIC_KEYS" | jq '.' > /dev/null 2>&1 || echo "::warning::ANTHROPIC_KEYS is not valid JSON"
          # Repo name comes verbatim from pr_url's path segment (Resolve inputs), but Gitea
          # resolves repo paths case-insensitively - match ANTHROPIC_KEYS the same way so a
          # differently-cased dispatch URL doesn't miss a key that actually exists.
          ANTHROPIC_API_KEY=$(printf '%s' "$ANTHROPIC_KEYS" | jq -r --arg repo "$REPO_NAME" \
            'to_entries | map(select(.key | ascii_downcase == ($repo | ascii_downcase))) | (.[0].value // empty)' 2>/dev/null || true)
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            ANTHROPIC_API_KEY="$ANTHROPIC_KEY_DEFAULT"
            echo "::warning::No dedicated API key for $ORG_NAME/$REPO_NAME - using default key"
            for CHAT_ID in ${TELEGRAM_CHAT_ID//,/ }; do
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" \
                -d "$(jq -n --argjson id "$CHAT_ID" --arg r "$REPO_NAME" '{chat_id:$id,text:("⚠️ Claude Review: add Anthropic key for `"+$r+"`"),parse_mode:"Markdown"}')" > /dev/null
            done
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No Anthropic API key available (neither ANTHROPIC_KEYS[$REPO_NAME] nor ANTHROPIC_KEY_DEFAULT is set)"
            exit 1
          fi
          echo "::add-mask::$ANTHROPIC_API_KEY"
          echo "api_key=$ANTHROPIC_API_KEY" >> $GITHUB_OUTPUT

      - name: Checkout repositories
        env:
          REF_NAME: ${{ github.ref_name }}
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          git config --global credential.helper '!f(){ echo "username=oauth2"; echo "password=$GITEA_TOKEN"; }; f'
          git clone "https://$GITEA_HOST/$ORG_NAME/ga-common" --depth=1 --branch "$REF_NAME" .
          git clone "https://$GITEA_HOST/$ORG_NAME/$REPO_NAME" repo
          # Fetch by PR number, not by $PR_BRANCH: head.ref is unreliable for fork PRs
          # (the branch lives in the fork, not this repo) and for PRs whose head branch
          # was deleted/renamed - pull/<N>/head always exists in the base repo, even after
          # the PR is merged and the branch is gone.
          if ! git -C repo fetch origin "pull/$PR_NUMBER/head"; then
            echo "::error::Could not fetch pull/$PR_NUMBER/head from $ORG_NAME/$REPO_NAME - the PR ref no longer exists on the remote"
            exit 1
          fi
          git -C repo checkout --detach FETCH_HEAD
          HEAD_SHA=$(git -C repo rev-parse HEAD)
          [ "$HEAD_SHA" = "$PR_SHA" ] || \
            echo "::warning::Branch tip $HEAD_SHA differs from dispatched SHA $PR_SHA (new push in flight) — benign: the superseding run will cancel this one"

      - name: Prepare review context
        id: prepare
        env:
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
          BUGZILLA_API_KEY: ${{ secrets.BUGZILLA_API_KEY }}
          BUGZILLA_HOST: ${{ secrets.BUGZILLA_HOST }}
        run: |
          set -euo pipefail
          source .gitea/scripts/review-steps.sh
          prepare_review_context

      - name: Non-ASCII comment check
        if: steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          source .gitea/scripts/gitea-api.sh
          NON_ASCII_COMMENT_ID=$(fetch_all_comments "$ORG_NAME/$REPO_NAME/issues/$PR_NUMBER/comments" | jq -r '[.[] | select(.body | contains("<!-- Non-ASCII-Check -->"))] | last | .id // empty')
          if python3 .gitea/scripts/check-english-comments.py repo/pr.diff > /tmp/english-check.md; then
            echo "Non-ASCII check passed"
            [ -n "$NON_ASCII_COMMENT_ID" ] && gitea_api_json "$ORG_NAME/$REPO_NAME/issues/comments/$NON_ASCII_COMMENT_ID" -X DELETE > /dev/null || true
            set_commit_status "$ORG_NAME/$REPO_NAME" "$PR_SHA" "success" "Ok" "Non-ASCII Check"
          else
            count=$(grep -c '^- \[' /tmp/english-check.md 2>/dev/null || true)
            echo "Non-ASCII check failed: $count violation(s)"
            upsert_review_comment "$ORG_NAME/$REPO_NAME" "$PR_NUMBER" /tmp/english-check.md "$NON_ASCII_COMMENT_ID" "" "<!-- Non-ASCII-Check -->"
            set_commit_status "$ORG_NAME/$REPO_NAME" "$PR_SHA" "failure" "Failed: $count violation(s)" "Non-ASCII Check"
          fi

      - name: Run review
        if: steps.prepare.outputs.skip != 'true'
        working-directory: repo
        env:
          ANTHROPIC_API_KEY: ${{ steps.select_key.outputs.api_key }}
          CLAUDE_MODEL: ${{ inputs.model }}
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          CLAUDE_EFFORT: ${{ inputs.effort }}
          CLAUDE_MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          set -euo pipefail
          npm install -g --no-fund --no-audit --loglevel=error "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION:-latest}"
          export PATH="$(npm config get prefix)/bin:$PATH"

          # Our own lock file is deliberately NOT $CONFIG_FILE.lock: the CLI uses that exact
          # path for its own internal locking (a mkdir/rmdir lockdir, going by the ENOTDIR
          # errors observed when it collides with a plain file left there), so reusing it here
          # left a stray plain file that raced the CLI's main process against its own
          # forked-skill subagent for the same path.
          CONFIG_FILE="$HOME/.claude.json"
          (
            flock -x 200
            EXISTING=$(cat "$CONFIG_FILE" 2>/dev/null || echo '{}')
            jq --arg p "$(pwd)" '.projects[$p].hasTrustDialogAccepted = true' <<< "$EXISTING" > "$CONFIG_FILE.tmp"
            mv "$CONFIG_FILE.tmp" "$CONFIG_FILE"
          ) 200>"$HOME/.claude-review-pretrust.lock"
          date +%s > ../review-start.txt
          echo "Running review with model: $CLAUDE_MODEL, effort: $CLAUDE_EFFORT (claude-code $(claude --version || echo unknown))"
          # /code-review is invoked as a slash command inside the prompt, and that ends
          # the turn as plain text (verified live) - --json-schema's tool-forcing never
          # kicks in when a skill is invoked, so this step no longer passes it.
          rc=0
          # Single attempt, no CLI timeout: --max-budget-usd bounds cost; job timeout-minutes is the backstop.
          # --debug-file is uploaded as a short-lived artifact by the next step - it's the only way
          # to tell after the fact whether a slow/hung run was stuck waiting on the API vs. churning
          # through tool calls.
          claude -p \
            --allowedTools "Read,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*)" --model "$CLAUDE_MODEL" \
            --effort "$CLAUDE_EFFORT" --max-budget-usd "$CLAUDE_MAX_BUDGET_USD" \
            --debug-file ../claude-debug.log \
            --output-format json < claude-prompt.txt > ../claude-output.json || rc=$?
          if [ "$rc" -ne 0 ] || ! jq -e '.is_error == false and ((.result // "") | length > 0)' ../claude-output.json > /dev/null 2>&1; then
            subtype=$(jq -r '.subtype // "unknown"' ../claude-output.json 2>/dev/null || echo "unparsable")
            echo "::error::Review failed (exit $rc, subtype: $subtype)"
            echo "Result excerpt: $(jq -r '.result // empty' ../claude-output.json 2>/dev/null | head -c 300 || true)"
            exit 1
          fi
          # Best-effort: extract+validate the trailing ```json block from the free-text
          # result. Failure here is not fatal - post_review_and_set_status already falls
          # back gracefully when claude-structured.json is missing/invalid.
          jq -r '.result' ../claude-output.json | python3 ../.gitea/scripts/extract-json.py > ../claude-structured.json || {
            echo "::warning::Could not extract a valid review JSON from the model's response — posting fallback"
            # claude-output.json never leaves this container, so this tail is the only
            # trace of what the model actually returned once the job finishes.
            echo "Result tail: $(jq -r '.result // empty' ../claude-output.json 2>/dev/null | tail -c 500 || true)"
          }
          echo "Review stats: $(jq -r '"\(.num_turns // "?") turns / \((.duration_ms // 0) / 1000 | round)s"' ../claude-output.json)"
          echo "Review findings: $([ -s ../claude-structured.json ] && jq '.findings | length' ../claude-structured.json 2>/dev/null || echo '?')"
          echo "Review cost: \$$(jq -r '.total_cost_usd // 0 | (. * 1000 | round) / 1000' ../claude-output.json) ($(jq -r '.modelUsage // {} | to_entries | map("\(.key): \(.value.inputTokens // 0)in/\(.value.outputTokens // 0)out") | join(", ")' ../claude-output.json 2>/dev/null || echo "n/a"))"

      - name: Upload review artifacts
        # v4/v7 (@actions/artifact v2+) intermittently failed here with GHESNotSupportedError -
        # its non-github.com host detection also trips on Gitea. v3 predates that check.
        uses: actions/upload-artifact@v3.2.2
        if: always() && steps.prepare.outcome != 'skipped' && steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        with:
          name: claude-review-artifacts
          path: |
            claude-debug.log
            claude-output.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Post review and set status
        if: always() && steps.prepare.outcome != 'skipped' && steps.prepare.outputs.skip != 'true'
        env:
          JOB_STATUS: ${{ job.status }}
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          source .gitea/scripts/review-steps.sh
          post_review_and_set_status
