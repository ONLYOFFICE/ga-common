name: Claude Code Review
run-name: "Review • ${{ inputs.pr_url }}"

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'PR URL (e.g. https://HOST/ORG/REPO/pulls/123)'
        required: true
        type: string
      model:
        description: 'Claude model'
        required: false
        type: string
        default: claude-sonnet-5
      claude_code_version:
        description: 'Claude Code CLI version (npm dist-tag or exact version)'
        required: false
        type: string
        default: 'latest'
      effort:
        description: 'Reasoning effort level'
        required: false
        type: choice
        default: 'medium'
        options:
          - low
          - medium
          - high
          - xhigh
          - max
      force:
        description: 'Force review even if the head SHA was already reviewed'
        required: false
        type: boolean
        default: false
      max_budget_usd:
        description: 'Hard cap on API spend for a single review run (USD)'
        required: false
        type: string
        default: '5'

env:
  GITEA_HOST: ${{ secrets.CI_GITEA_HOST }}

concurrency:
  group: Claude-Review-${{ inputs.pr_url }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_URL: ${{ inputs.pr_url }}
      FORCE_REVIEW: ${{ inputs.force }}
    steps:
      - name: Resolve inputs
        env:
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$PR_URL" =~ ^https?://[^/]+/([^/]+)/([^/]+)/pulls/([0-9]+) ]]; then
            ORG_NAME="${BASH_REMATCH[1]}"
            REPO_NAME="${BASH_REMATCH[2]}"
            PR_NUMBER="${BASH_REMATCH[3]}"
          else
            echo "::error::Could not parse org/repo/PR number from pr_url: $PR_URL"
            exit 1
          fi
          PR_INFO=$(curl -sf -H "Authorization: token $GITEA_TOKEN" "https://$GITEA_HOST/api/v1/repos/$ORG_NAME/$REPO_NAME/pulls/$PR_NUMBER") \
            || { echo "::error::Could not fetch PR $ORG_NAME/$REPO_NAME!$PR_NUMBER from the Gitea API - check the URL and that the PR exists"; exit 1; }
          PR_BRANCH=$(jq -r '.head.ref' <<< "$PR_INFO")
          PR_SHA=$(jq -r '.head.sha' <<< "$PR_INFO")
          BASE_BRANCH=$(jq -r '.base.ref' <<< "$PR_INFO")
          if [ -z "$PR_BRANCH" ] || [ "$PR_BRANCH" = "null" ] || [ -z "$PR_SHA" ] || [ "$PR_SHA" = "null" ]; then
            echo "::error::PR $ORG_NAME/$REPO_NAME!$PR_NUMBER has no head branch/SHA (source branch likely deleted) - cannot check it out"
            exit 1
          fi
          { echo "ORG_NAME=$ORG_NAME"; echo "REPO_NAME=$REPO_NAME"; echo "PR_NUMBER=$PR_NUMBER"
            echo "PR_BRANCH=$PR_BRANCH"; echo "BASE_BRANCH=$BASE_BRANCH"; echo "PR_SHA=$PR_SHA"
          } >> "$GITHUB_ENV"
          echo "Resolved: $ORG_NAME/$REPO_NAME!$PR_NUMBER ($PR_BRANCH → $BASE_BRANCH @ ${PR_SHA:0:10})"

      - name: Select API key
        id: select_key
        env:
          ANTHROPIC_KEYS: ${{ secrets.ANTHROPIC_KEYS }}
          ANTHROPIC_KEY_DEFAULT: ${{ secrets.ANTHROPIC_KEY_DEFAULT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$ANTHROPIC_KEYS" | jq '.' > /dev/null 2>&1 || echo "::warning::ANTHROPIC_KEYS is not valid JSON"
          # Repo name is case-sensitive from pr_url, but Gitea resolves repos case-insensitively - match ANTHROPIC_KEYS the same way.
          ANTHROPIC_API_KEY=$(printf '%s' "$ANTHROPIC_KEYS" | jq -r --arg repo "$REPO_NAME" \
            'to_entries | map(select(.key | ascii_downcase == ($repo | ascii_downcase))) | (.[0].value // empty)' 2>/dev/null || true)
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            ANTHROPIC_API_KEY="$ANTHROPIC_KEY_DEFAULT"
            echo "::warning::No dedicated API key for $ORG_NAME/$REPO_NAME - using default key"
            for CHAT_ID in ${TELEGRAM_CHAT_ID//,/ }; do
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" \
                -d "$(jq -n --argjson id "$CHAT_ID" --arg r "$REPO_NAME" '{chat_id:$id,text:("⚠️ Claude Review: add Anthropic key for `"+$r+"`"),parse_mode:"Markdown"}')" > /dev/null
            done
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No Anthropic API key available (neither ANTHROPIC_KEYS[$REPO_NAME] nor ANTHROPIC_KEY_DEFAULT is set)"
            exit 1
          fi
          echo "::add-mask::$ANTHROPIC_API_KEY"
          echo "api_key=$ANTHROPIC_API_KEY" >> $GITHUB_OUTPUT

      - name: Checkout repositories
        env:
          REF_NAME: ${{ github.ref_name }}
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          git config --global credential.helper '!f(){ echo "username=oauth2"; echo "password=$GITEA_TOKEN"; }; f'
          git clone "https://$GITEA_HOST/$ORG_NAME/ga-common" --depth=1 --branch "$REF_NAME" .
          git clone "https://$GITEA_HOST/$ORG_NAME/$REPO_NAME" repo
          # Fetch by PR number, not $PR_BRANCH: head.ref is unreliable for fork PRs and deleted/renamed branches - pull/<N>/head always exists.
          if ! git -C repo fetch origin "pull/$PR_NUMBER/head"; then
            echo "::error::Could not fetch pull/$PR_NUMBER/head from $ORG_NAME/$REPO_NAME - the PR ref no longer exists on the remote"
            exit 1
          fi
          git -C repo checkout --detach FETCH_HEAD
          HEAD_SHA=$(git -C repo rev-parse HEAD)
          [ "$HEAD_SHA" = "$PR_SHA" ] || \
            echo "::warning::Branch tip $HEAD_SHA differs from dispatched SHA $PR_SHA (new push in flight) — benign: the superseding run will cancel this one"

      - name: Prepare review context
        id: prepare
        env:
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
          BUGZILLA_API_KEY: ${{ secrets.BUGZILLA_API_KEY }}
          BUGZILLA_HOST: ${{ secrets.BUGZILLA_HOST }}
        run: |
          set -euo pipefail
          source .gitea/scripts/review-steps.sh
          prepare_review_context

      - name: Non-ASCII comment check
        if: steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          source .gitea/scripts/gitea-api.sh
          NON_ASCII_COMMENT_ID=$(fetch_all_comments "$ORG_NAME/$REPO_NAME/issues/$PR_NUMBER/comments" | jq -r '[.[] | select(.body | contains("<!-- Non-ASCII-Check -->"))] | last | .id // empty')
          if python3 .gitea/scripts/check-english-comments.py repo/pr.diff > /tmp/english-check.md; then
            echo "Non-ASCII check passed"
            [ -n "$NON_ASCII_COMMENT_ID" ] && gitea_api_json "$ORG_NAME/$REPO_NAME/issues/comments/$NON_ASCII_COMMENT_ID" -X DELETE > /dev/null || true
            set_commit_status "$ORG_NAME/$REPO_NAME" "$PR_SHA" "success" "Ok" "Non-ASCII Check"
          else
            count=$(grep -c '^- \[' /tmp/english-check.md 2>/dev/null || true)
            echo "Non-ASCII check failed: $count violation(s)"
            upsert_review_comment "$ORG_NAME/$REPO_NAME" "$PR_NUMBER" /tmp/english-check.md "$NON_ASCII_COMMENT_ID" "" "<!-- Non-ASCII-Check -->"
            set_commit_status "$ORG_NAME/$REPO_NAME" "$PR_SHA" "failure" "Failed: $count violation(s)" "Non-ASCII Check"
          fi

      - name: Run review (isolated container)
        if: steps.prepare.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ steps.select_key.outputs.api_key }}
          CLAUDE_MODEL: ${{ inputs.model }}
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          CLAUDE_EFFORT: ${{ inputs.effort }}
          CLAUDE_MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ANTHROPIC_API_KEY"

          # DooD: claude CLI runs in a throwaway nested container with only ANTHROPIC_API_KEY and egress restricted to npm + Anthropic via a Squid proxy - that containment is what lets --allowedTools be dropped entirely below (full tool access).
          # claude-review/egress-proxy are sibling containers on the HOST daemon, not child processes of this job, so cancelling the job doesn't stop them by itself - clean up on any exit path, signalled or not.
          cleanup_sandbox() {
            docker rm -f egress-proxy claude-review > /dev/null 2>&1 || true
            docker network rm claude-internal > /dev/null 2>&1 || true
          }
          trap cleanup_sandbox EXIT INT TERM

          echo "=== 0. defensive cleanup: DooD resources persist on the HOST daemon ==="
          docker rm -f egress-proxy claude-review > /dev/null 2>&1 || true
          docker network rm claude-internal > /dev/null 2>&1 || true

          echo "=== 0.5 resolve the host path backing this job's workspace ==="
          # `docker run -v` resolves host paths via the HOST daemon under DooD, so self-inspect this job container's own Mounts to recover the host-side equivalent of $PWD.
          mkdir -p claude-output
          # Pre-create both files before anything below can fail and exit early under `set -e`, so Upload/Post always find real (if empty) files instead of none at all.
          touch claude-output/claude-output.json claude-output/claude-debug.log
          HOST_PWD=$(docker inspect "$(hostname)" --format '{{json .Mounts}}' 2>/dev/null | jq -r --arg pwd "$PWD" '
            [.[] | select(.Destination as $d | $pwd == $d or ($pwd | startswith($d + "/")))]
            | sort_by(-(.Destination | length)) | .[0]
            | if . then .Source + ($pwd | ltrimstr(.Destination)) else empty end
          ')
          if [ -z "$HOST_PWD" ]; then
            echo "::error::Could not resolve the host path backing $PWD via docker inspect - cannot bind-mount an output dir into the sandbox"
            exit 1
          fi
          HOST_OUTPUT_DIR="$HOST_PWD/claude-output"

          echo "=== 1. isolated network + egress-restricted proxy (npm + Anthropic only) ==="
          docker network create --internal claude-internal
          mkdir -p /tmp/squid
          cat > /tmp/squid/squid.conf << 'EOF'
          http_port 3128
          acl allowed_dst dstdomain .npmjs.org api.anthropic.com
          http_access allow allowed_dst
          http_access deny all
          EOF
          docker create --name egress-proxy --network claude-internal ubuntu/squid:latest
          # `docker cp` streams content over the API, so it works under DooD regardless of whose filesystem the source is on, unlike `-v`.
          docker cp /tmp/squid/squid.conf egress-proxy:/etc/squid/squid.conf
          docker start egress-proxy
          docker network connect bridge egress-proxy
          sleep 2

          echo "=== 2. claude container: only ANTHROPIC_API_KEY, no docker.sock, egress-restricted ==="
          # /output is the ONLY bind mount into the sandbox, a dedicated empty dir (not the job's real workspace) - writes land in ./claude-output immediately, surviving the container being lost.
          docker run -d --name claude-review --network claude-internal \
            -v "$HOST_OUTPUT_DIR:/output" \
            -e ANTHROPIC_API_KEY \
            -e CLAUDE_CODE_VERSION \
            -e CLAUDE_MODEL \
            -e CLAUDE_EFFORT \
            -e CLAUDE_MAX_BUDGET_USD \
            -e CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
            -e HTTP_PROXY=http://egress-proxy:3128 \
            -e HTTPS_PROXY=http://egress-proxy:3128 \
            -e http_proxy=http://egress-proxy:3128 \
            -e https_proxy=http://egress-proxy:3128 \
            -e NO_PROXY=localhost,127.0.0.1 \
            -w /workspace \
            node:20-slim sleep infinity

          docker exec claude-review mkdir -p /workspace
          docker cp repo/. claude-review:/workspace/
          # REVIEW.md does `Read ../review/UNCOVERED-REVIEW.md` relative to /workspace, so review/ has to be copied in too, as a sibling, or that Read fails.
          docker cp review/. claude-review:/review/
          echo "Files inside container: $(docker exec claude-review sh -c 'find /workspace -type f | wc -l')"

          echo "=== 3. npm install as root (privileged, not exposed to untrusted PR content) ==="
          docker exec claude-review npm install -g --no-fund --no-audit --loglevel=error "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION:-latest}"
          docker exec claude-review sh -c 'echo "claude version: $(claude --version || echo unknown)"'
          # --dangerously-skip-permissions refuses to run as root, and docker cp leaves files root-owned - hand them to the built-in unprivileged "node" user.
          docker exec claude-review chown -R node:node /workspace /output

          echo "=== 4. run claude unprivileged, full tool access (sandbox replaces --allowedTools) ==="
          rc=0
          # Single attempt, no CLI timeout: --max-budget-usd bounds cost, job timeout-minutes is the backstop, --debug-file is uploaded next step for post-mortem.
          docker exec --user node -w /workspace claude-review bash -c '
            set -euo pipefail
            claude -p --model "$CLAUDE_MODEL" --effort "$CLAUDE_EFFORT" --max-budget-usd "$CLAUDE_MAX_BUDGET_USD" \
              --debug-file /output/claude-debug.log --output-format json --dangerously-skip-permissions \
              < claude-prompt.txt > /output/claude-output.json
          ' || rc=$?
          # No docker cp needed - /output is bind-mounted from $HOST_OUTPUT_DIR (./claude-output here) so both sides already see the same files.
          [ -s claude-output/claude-output.json ] || echo '{}' > claude-output/claude-output.json

          # cleanup_sandbox runs automatically here too, via the EXIT trap above.

          if [ "$rc" -ne 0 ] || ! jq -e '.is_error == false and ((.result // "") | length > 0)' claude-output/claude-output.json > /dev/null 2>&1; then
            subtype=$(jq -r '.subtype // "unknown"' claude-output/claude-output.json 2>/dev/null || echo "unparsable")
            echo "::error::Review failed (exit $rc, subtype: $subtype)"
            echo "Result excerpt: $(jq -r '.result // empty' claude-output/claude-output.json 2>/dev/null | head -c 300 || true)"
            exit 1
          fi
          # Best-effort: extract+validate the trailing ```json block - failure isn't fatal, post_review_and_set_status already has a fallback.
          jq -r '.result' claude-output/claude-output.json | python3 .gitea/scripts/extract-json.py > claude-structured.json || {
            echo "::warning::Could not extract a valid review JSON from the model's response — posting fallback"
            echo "Result tail: $(jq -r '.result // empty' claude-output/claude-output.json 2>/dev/null | tail -c 500 || true)"
          }
          echo "Review stats: $(jq -r '"\(.num_turns // "?") turns / \((.duration_ms // 0) / 1000 | round)s"' claude-output/claude-output.json)"
          echo "Review findings: $([ -s claude-structured.json ] && jq '.findings | length' claude-structured.json 2>/dev/null || echo '?')"
          echo "Review cost: \$$(jq -r '.total_cost_usd // 0 | (. * 1000 | round) / 1000' claude-output/claude-output.json) ($(jq -r '.modelUsage // {} | to_entries | map("\(.key): \(.value.inputTokens // 0)in/\(.value.outputTokens // 0)out") | join(", ")' claude-output/claude-output.json 2>/dev/null || echo "n/a"))"

      - name: Upload review artifacts
        # v4/v7 (@actions/artifact v2+) intermittently failed here with GHESNotSupportedError - v3 predates that non-github.com host check.
        uses: actions/upload-artifact@v3.2.2
        if: always() && steps.prepare.outcome != 'skipped' && steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        with:
          name: claude-review-artifacts
          path: |
            claude-output/claude-debug.log
            claude-output/claude-output.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Post review and set status
        if: always() && steps.prepare.outcome != 'skipped' && steps.prepare.outputs.skip != 'true'
        env:
          JOB_STATUS: ${{ job.status }}
          GITEA_TOKEN: ${{ secrets.PAT_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          source .gitea/scripts/review-steps.sh
          post_review_and_set_status
